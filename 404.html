<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada — Rodolfo Cruz</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .notfound {
      min-height: 100vh;
      display: grid;
      place-content: center;
      text-align: center;
      padding: 24px;
    }
    .notfound .code {
      font-family: var(--mono);
      font-size: clamp(4rem, 16vw, 8rem);
      font-weight: 700;
      line-height: 1;
      color: var(--accent);
      opacity: 0.35;
      margin-bottom: 8px;
    }
    .notfound h1 { font-size: clamp(1.4rem, 4vw, 2rem); }
    .notfound p { color: var(--text-dim); max-width: 40ch; margin-inline: auto; }
  </style>
</head>
<body>
  <main class="notfound">
    <p class="code">404</p>
    <h1 id="nf-title">Esta página no existe</h1>
    <p id="nf-text">Puede que el enlace esté roto o que la página se haya movido.</p>
    <p style="margin-top:24px">
      <a class="btn btn-primary" href="./" id="nf-link">Volver al inicio</a>
    </p>
  </main>

  <script>
    (function () {
      var saved = localStorage.getItem("portfolio-lang");
      var lang = (saved === "es" || saved === "en") ? saved
        : ((navigator.language || "es").toLowerCase().indexOf("en") === 0 ? "en" : "es");

      var theme = localStorage.getItem("portfolio-theme");
      if (theme !== "dark" && theme !== "light") {
        theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", theme);

      if (lang === "en") {
        document.documentElement.lang = "en";
        document.title = "Page not found — Rodolfo Cruz";
        document.getElementById("nf-title").textContent = "This page doesn't exist";
        document.getElementById("nf-text").textContent =
          "The link may be broken, or the page may have moved.";
        document.getElementById("nf-link").textContent = "Back to home";
      }
    })();
  </script>
</body>
</html>
