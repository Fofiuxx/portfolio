<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Reconocimiento facial">
  <defs>
    <linearGradient id="rfBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1230"/>
      <stop offset="100%" stop-color="#0b0f1a"/>
    </linearGradient>
    <linearGradient id="rfScan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#rfBg)"/>

  <!-- rejilla de puntos -->
  <g fill="#a78bfa" fill-opacity="0.12">
