    <g fill="#c4b5fd">
      <circle cx="-34" cy="-24" r="4"/><circle cx="34" cy="-24" r="4"/>
      <circle cx="0" cy="6" r="4"/><circle cx="-26" cy="46" r="4"/>
      <circle cx="26" cy="46" r="4"/><circle cx="0" cy="52" r="4"/>
      <circle cx="-58" cy="-40" r="3"/><circle cx="58" cy="-40" r="3"/>
      <circle cx="-52" cy="60" r="3"/><circle cx="52" cy="60" r="3"/>
      <circle cx="0" cy="-78" r="3"/><circle cx="0" cy="88" r="3"/>
    </g>
    <g stroke="#a78bfa" stroke-opacity="0.6" stroke-width="1.2" fill="none">
