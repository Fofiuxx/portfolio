  <!-- línea de escaneo -->
  <rect x="268" y="150" width="264" height="70" fill="url(#rfScan)"/>
  <rect x="268" y="218" width="264" height="3" fill="#c4b5fd" fill-opacity="0.9"/>

  <!-- resultado -->
  <g transform="translate(556 296)">
    <rect width="196" height="58" rx="9" fill="#0f1a14" stroke="#3fb950" stroke-width="1.5"/>
    <circle cx="30" cy="29" r="13" fill="#3fb950"/>
    <path d="M24 29l4.5 5 9-10" stroke="#0f1a14" stroke-width="2.6" fill="none"
