    <circle cx="60" cy="140" r="2"/><circle cx="140" cy="140" r="2"/><circle cx="220" cy="140" r="2"/>
    <circle cx="60" cy="220" r="2"/><circle cx="140" cy="220" r="2"/><circle cx="220" cy="220" r="2"/>
    <circle cx="60" cy="300" r="2"/><circle cx="140" cy="300" r="2"/><circle cx="220" cy="300" r="2"/>
    <circle cx="60" cy="380" r="2"/><circle cx="140" cy="380" r="2"/><circle cx="220" cy="380" r="2"/>
  </g>

  <!-- marco de cámara -->
