    <path d="M-86 -14q86 34 172 0" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.5"/>
    <path d="M-86 24q86 34 172 0" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.5"/>
    <path d="M-86 -52q86 26 172 0" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.5"/>
    <path d="M0 -106v212" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="1.5"/>
    <path d="M-44 -100v196M44 -100v196" stroke="#a78bfa" stroke-opacity="0.22" stroke-width="1.5"/>

