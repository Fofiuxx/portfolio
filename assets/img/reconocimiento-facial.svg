      <path d="M-34 -24L0 6l34-30"/>
      <path d="M-26 46L0 52l26-6"/>
      <path d="M-52 60L-26 46M52 60L26 46"/>
      <path d="M0 -78l-58 38M0 -78l58 38"/>
      <path d="M-52 60L0 88l52-28"/>
